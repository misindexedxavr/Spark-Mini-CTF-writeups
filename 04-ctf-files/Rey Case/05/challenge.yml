name: "Alias Archaeology"
category: OSINT
description: |
  Event rule: Use public security reporting only. Never visit leak sites or search for credentials. Some reports about this case contain personal details about a private individual. Do not search for, record, or submit them. Every flag is an alias, group, tool, or date. Treat allegations as allegations; detention is not a conviction.

  Flag format: Spark{lowercase_with_underscores}

  The threat-intelligence report from challenge 2 gives the handle this actor used just before the current one. Do not chase older handles. Submit the previous handle and the current handle.

type: dynamic
extra:
    initial: 500
    decay: 15
    minimum: 100
    function: logarithmic
flags:
    - { type: "static", content: "Spark{hikki_chan_rey}", data: "case_insensitive" }
hints:
    - { content: "Search the page for the phrase `previously known as`.", cost: 10 }
    - { content: "Normalize the hyphen in the earlier handle as an underscore.", cost: 20 }
# wrong-attempt limit (0 = unlimited)
attempts: 0
requirements:
    - "Warmup01"
    - "Warmup02"
    - "Warmup03"
    - "Warmup04"
    - "Warmup05"
    - "Newest Trace"
    - "The Co-Founder"
    - "Group to Victim"
    - "One Banner, Three Names"
state: visible
version: "0.1"
